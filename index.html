<!DOCTYPE html>
<html>

<body style="margin:0;">

<img id="img">

<script>

fetch("https://api.inaturalist.org/v1/observations/species_counts?created_d1=2026-01-18&place_id=218604&project_id=cuenca-estero-penco-plantas")

.then(r => r.json())

.then(data => {

  const total = data.results.length;

  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg" width="140" height="30">
    <text x="0" y="22"
      font-size="20"
      font-family="Arial"
      fill="black">
      ${total} especies
    </text>
  </svg>`;

  const url =
    "data:image/svg+xml;charset=utf-8," +
    encodeURIComponent(svg);

  document.getElementById("img").src = url;

});

</script>

</body>
</html>
